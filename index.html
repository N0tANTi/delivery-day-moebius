<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe0ee; }
  canvas { display: block; }
  #title {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fffaf0; text-shadow: 0 2px 12px rgba(40, 50, 80, .45); font-family: Georgia, 'Times New Roman', serif;
    pointer-events: none; transition: opacity 2.5s ease;
  }
  #title h1 { font-size: clamp(40px, 7vw, 92px); font-weight: normal; letter-spacing: .04em; margin: 0; }
  #title p { font-size: clamp(14px, 1.6vw, 20px); margin: .6em 0 0; opacity: .95; }
  #title .keys { font-family: system-ui, sans-serif; font-size: 13px; margin-top: 2.2em; opacity: .9; line-height: 1.8; text-align: center; }
  #title .go { margin-top: 1.6em; font-family: system-ui, sans-serif; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  #hud {
    position: fixed; left: 18px; bottom: 14px; color: rgba(255, 252, 240, .85); font: 12px/1.4 system-ui, sans-serif;
    text-shadow: 0 1px 4px rgba(30, 40, 70, .5); letter-spacing: .06em; pointer-events: none; transition: opacity .6s;
  }
  .hidden { opacity: 0 !important; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

</script>

<body>
<div id="title">
  <h1>Delivery Day</h1>
  <p>a summer morning over the rooftops of Prague</p>
  <div class="keys">
    W / S &nbsp;faster · slower &nbsp;&nbsp; A / D &nbsp;bank<br>
    Space / Shift &nbsp;climb · descend &nbsp;&nbsp; hold mouse &nbsp;steer<br>
    H &nbsp;hide text &nbsp;&nbsp; M &nbsp;mute
  </div>
  <div class="go">press any key to fly</div>
</div>
<div id="hud"></div>
<script type="module" src="src/main.js"></script>
</body>
